<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    IrisDeck app icon: a slide on an easel, with a title, two lines of text and a pie chart, the
    same drawing the Iris Workspace shows (Iris/src/shared/types/workspace.types.ts, hue 48). The
    gradient is its oklch(0.66 0.2 48) → oklch(0.6 0.21 90) in sRGB, so every renderer draws the
    same colours. Every PNG, .ico and .icns in this folder is rendered from this file.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ee5f00"/>
      <stop offset="1" stop-color="#b07400"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#g)"/>
  <rect x="12" y="14" width="40" height="28" rx="3.5" fill="#fff" fill-opacity=".95"/>
  <path d="M32 42v6M25.5 52.5 32 48l6.5 4.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M18 21.5h12" stroke="url(#g)" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M18 27.5h9M18 33h6" stroke="url(#g)" stroke-width="2.2" stroke-linecap="round" stroke-opacity=".55"/>
  <circle cx="40" cy="29.5" r="7" fill="url(#g)"/>
  <path d="M40 29.5v-7a7 7 0 0 1 7 7z" fill="#fff" fill-opacity=".6"/>
</svg>
